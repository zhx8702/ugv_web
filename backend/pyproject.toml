[project]
name = "web-control-backend"
version = "1.0.0"
description = "Web Control Backend - Flask server for robot control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-socketio>=5.3.5",
    "flask-cors>=4.0.0",
    "python-socketio>=5.10.0",
    "python-engineio>=4.8.0",

    # WebSocket & Async
    "eventlet>=0.33.3",
    "gevent>=23.9.1",
    "gevent-websocket>=0.10.1",

    # WebRTC (low-latency video streaming)
    "aiortc>=1.8.0",
    "av>=10.0.0",

    # HTTP & API
    "requests>=2.31.0",
    "werkzeug>=3.0.1",

    # Configuration
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",

    # Hardware Control
    "pyserial>=3.5",
    "numpy>=1.24.3",

    # Computer Vision
    "opencv-python>=4.9.0.80",
    "imageio>=2.31.5",
    "imageio-ffmpeg>=0.4.9",
    "pillow>=10.0.0",

    # CV utilities
    "imutils>=0.5.4",

    # Audio playback
    "pygame>=2.5.0",

    # TTS (Text-to-Speech)
    "pyttsx3>=2.90",

    # System Monitoring
    "psutil>=5.9.6",

    # Development
    "python-daemon>=3.0.1",
]

[project.optional-dependencies]
# MediaPipe (x86/macOS only, not available on ARM64 Linux)
mediapipe = [
    "mediapipe>=0.10.0",
]
# Raspberry Pi CSI camera
rpi = [
    "picamera2>=0.3.17",
]
# OAK depth camera
oak = [
    "depthai>=2.24.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
web-control = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
